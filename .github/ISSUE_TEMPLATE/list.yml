name: List
description: 溜めて見返すリスト（欲しい物・積み本など）
type: List
projects: ["synmm/1"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 用途
      description: 何のリストか・いつ見返すか
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: 項目
      description: チェックリスト（`- [ ]`）か表で書く。済んだものは ✓ を付けるか消す
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: メモ
